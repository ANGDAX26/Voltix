<script>
    // Toggle del menú hamburguesa en móviles
    document.getElementById('btn-menu').addEventListener('click', function () {
        document.getElementById('nav-principal').classList.toggle('open');
    });

    // Control de estado de sesión
    (function () {
        fetch('../PHP/estado_sesion.php')
            .then(function (r) { return r.ok ? r.json() : Promise.reject(r); })
            .then(function (sesion) {
                var cerrarLi = document.getElementById('nav-cerrar-sesion');
                var loginLi = document.getElementById('enlace-login');
                if (sesion.logueado) {
                    if (cerrarLi) cerrarLi.style.display = 'block';
                    if (loginLi) loginLi.style.display = 'none';
                }
            })
            .catch(function () { /* Silencioso */ });
    })();
</script>
